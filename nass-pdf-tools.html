.max-h-\[50vh\]{max-height:50vh}.max-h-full{max-height:100%}.my-3{margin-top:.75rem;margin-bottom:.75rem}

<body class="bg-black text-white font-sans min-h-screen antialiased">
<div class="max-w-md mx-auto min-h-screen pb-32">

  <header class="flex items-center justify-between px-5" style="padding-top:max(1.25rem, env(safe-area-inset-top))">
    <div class="w-10 h-10 rounded-xl bg-[#6d4fb3] grid place-items-center font-bold text-lg shadow-[3px_3px_0_#e8b923]">ن</div>
    <button id="avatar" aria-label="الحساب" class="w-11 h-11 overflow-hidden rounded-full border-2 border-purple-300/60 bg-[#4c2fa8] grid place-items-center font-bold">👤</button>
  </header>

  <div id="view-home">
  <h1 class="px-5 mt-8 text-3xl font-extrabold">مرحبًا بك</h1>

  <section id="promo" class="mx-5 mt-6 flex items-stretch rounded-2xl border border-white/20 bg-[#0b0b0f] overflow-hidden">
    <div class="w-28 shrink-0 bg-pink-950/30 grid place-items-center text-5xl">🖼️</div>
    <div class="flex-1 p-4 relative">
      <button id="promo-x" aria-label="إغلاق" class="absolute top-3 left-3 text-white/70">✕</button>
      <h3 class="font-bold">اكتب بالعربية داخل PDF</h3>
      <p class="text-sm text-white/70 mt-1 leading-relaxed">حوّل نصك أو صورك أو ملف Word إلى PDF مباشرة، وكل شيء يبقى على جهازك.</p>
    </div>
  </section>

  <h2 class="px-5 mt-9 text-lg text-white/90">ماذا تريد أن تفعل؟</h2>
  <div id="tiles" class="flex gap-3 overflow-x-auto px-5 mt-4 pb-1"></div>

  <nav id="tabs" class="mt-9 mx-5 flex gap-7 text-lg border-b border-white/10">
    <button data-tab="recent">الأخيرة</button>
    <button data-tab="starred">مميز بنجمة</button>
    <button data-tab="device">على الجهاز</button>
  </nav>
  <div class="px-5">
    <input id="search" placeholder="ابحث في ملفاتك..." class="hidden w-full mt-4 bg-white/5 border border-white/15 rounded-xl p-3 text-white placeholder-white/40">
    <div id="list" class="mt-1"></div>
  </div>
  </div>

  <div id="view-tools" class="hidden">
    <h1 class="px-5 mt-8 text-3xl font-extrabold">الأدوات</h1>
    <nav id="ctabs" class="mt-7 mx-5 flex gap-6 text-xl border-b border-white/10 overflow-x-auto"></nav>
    <div id="cards" class="grid grid-cols-2 gap-3 px-5 mt-6"></div>
  </div>
</div>

<button id="fab" aria-label="جديد" class="fixed bottom-24 w-14 h-14 rounded-full bg-sky-400 text-black text-4xl leading-none grid place-items-center shadow-lg z-30" style="left:max(1.25rem, calc(50% - 14rem + 1.25rem))">+</button>

<nav class="fixed bottom-0 inset-x-0 z-30 bg-black border-t border-white/10" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-md mx-auto grid grid-cols-4 text-xs">
    <button data-nav="home" class="py-3 grid justify-items-center gap-1 text-sky-400"><span class="text-2xl">🏠</span>الرئيسية</button>
    <button data-nav="files" class="py-3 grid justify-items-center gap-1"><span class="text-2xl">📁</span>الملفات</button>
    <button data-nav="search" class="py-3 grid justify-items-center gap-1"><span class="text-2xl">🔍</span>بحث</button>
    <button data-nav="tools" class="py-3 grid justify-items-center gap-1"><span class="text-2xl">🧰</span>الأدوات</button>
  </div>
</nav>

<div id="sheet" class="fixed inset-0 z-50 hidden">
  <div id="sheet-bg" class="absolute inset-0 bg-black/70"></div>
  <div class="absolute bottom-0 inset-x-0 max-w-md mx-auto bg-[#17131f] rounded-t-3xl p-5 max-h-[85vh] overflow-y-auto" style="padding-bottom:max(1.25rem, env(safe-area-inset-bottom))">
    <div class="flex items-center justify-between gap-3 mb-4">
      <h3 id="sheet-title" class="font-extrabold text-lg truncate"></h3>
      <button id="sheet-x" aria-label="إغلاق" class="text-white/70 text-xl">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" class="fixed bottom-28 inset-x-5 max-w-md mx-auto hidden rounded-xl px-4 py-3 text-sm font-bold text-center z-[60]"></div>

<script>
  const $ = s => document.querySelector(s);
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  // تجزئة قديمة تُستعمل لقراءة الحسابات القديمة فقط، ولا تُنشأ بها حسابات جديدة. تُرقّى تلقائيًا عند الدخول

  async function hashPassword(password, salt, iter = PBKDF2_ITER, weak = false) {

  const QUESTIONS = ['ما اسم أول مدرسة التحقت بها؟', 'ما اسم أقرب صديق في طفولتك؟', 'في أي مدينة وُلدت؟', 'ما اسم أول حيوان أليف امتلكته؟', 'ما اسم الشارع الذي نشأت فيه؟'];

  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function validate(email, password, strict) {

      if (!EMAIL_RE.test(email)) throw new Error('اكتب بريدًا إلكترونيًا صحيحًا.');
      if (password.length < 6) throw new Error('كلمة المرور قصيرة، استخدم 6 أحرف على الأقل.');

  // يعيد رمز الاسترجاع ليُعرض للمستخدم مرة واحدة
  async function signUp(email, password, name = '', question = '', answer = '') {
    validate(email, password, true);

    await setPassword(u, password);
    const code = await setupRecovery(u, qa.q, qa.a);

  async function signIn(email, password) {

  async function changePassword(email, oldPass, newPass) {

    if (newPass.length < 6) throw new Error('كلمة المرور الجديدة قصيرة، استخدم 6 أحرف على الأقل.');
    const st = readStore(), u = st.users[email];

    checkLock(email);

    clearFails(email);

  }

  async function addRecovery(email, password, question, answer) {
    const qa = checkQA(question, answer);
    const st = readStore(), u = st.users[email];
    if (!u) throw new Error('الحساب غير موجود.');
    if (!password) throw new Error('اكتب كلمة المرور الحالية.');
    checkLock(email);
    if (!(await verifyPassword(u, password))) { recordFail(email); throw new Error('كلمة المرور غير صحيحة.'); }
    clearFails(email);
    const code = await setupRecovery(u, qa.q, qa.a);
    writeStore(st);
    return code;
  }

  async function resetPassword(email, newPass, { code = '', answer = '' } = {}) {
    if (newPass.length < 6) throw new Error('كلمة المرور الجديدة قصيرة، استخدم 6 أحرف على الأقل.');
    const st = readStore(), u = st.users[email];
    if (!u || !u.rec) throw new Error('لا توجد وسيلة استرجاع لهذا الحساب.');
    const key = 'r:' + email;
    checkLock(key);
    let by = '';
    if (normCode(code)) by = (await checkSecret(u.rec.code, normCode(code))) ? 'code' : '';
    else if (answer.trim() && u.rec.ans) by = (await checkSecret(u.rec.ans, normAnswer(answer))) ? 'answer' : '';
    else throw new Error('اكتب رمز الاسترجاع أو إجابة سؤال الأمان.');
    if (!by) { recordFail(key); throw new Error('رمز الاسترجاع أو الإجابة غير صحيحة.'); }
    clearFails(key); clearFails(email);
    await setPassword(u, newPass);
    let fresh = '';
    if (by === 'code') { fresh = newRecoveryCode(); u.rec.code = await makeSecret(normCode(fresh)); } // الرمز يُستعمل مرة واحدة
    st.session = email;
    writeStore(st);
    return fresh;
  }

  async function removeUserData(st, email) {

    for (const k of (keys || [])) await dbRun('readwrite', s => s.delete(k));
    delete st.users[email];
    if (st.session === email) st.session = null;
    writeStore(st);
    clearFails(email); clearFails('r:' + email);
  }
  async function deleteAccount(email, password) {
    const st = readStore(), u = st.users[email];
    if (!u) throw new Error('الحساب غير موجود.');
    if (!password) throw new Error('اكتب كلمة المرور للتأكيد.');
    checkLock(email);
    if (!(await verifyPassword(u, password))) { recordFail(email); throw new Error('كلمة المرور غير صحيحة.'); }
    await removeUserData(st, email);
  }

    if (!st.users[email]) throw new Error('الحساب غير موجود.');
    await removeUserData(st, email);
  }


let dbPromise = null;
  function openDb() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open('nass', 1);
        req.onupgradeneeded = () => {
          const store = req.result.createObjectStore('items', { keyPath: 'id' });
          store.createIndex('user', 'user');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }

  async function dbRun(mode, fn) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const t = db.transaction('items', mode);
      const req = fn(t.objectStore('items'));
      t.oncomplete = () => resolve(req ? req.result : undefined);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

  async function saveItem(tool, source, blob, outName) {
    const user = currentUser();
    if (!user) return;
    await dbRun('readwrite', s => s.put({
      id: uid(), user, tool, source, outName, blob, createdAt: Date.now()
    }));
    ensurePersist();
  }

  async function listItems() {
    const user = currentUser();
    if (!user) return [];
    const rows = await dbRun('readonly', s => s.index('user').getAll(user));
    return (rows || []).sort((a, b) => b.createdAt - a.createdAt);
  }

  async function deleteItem(id) {
    await dbRun('readwrite', s => s.delete(id));
    loadHistory();
  }


const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  // ================= دعم Capacitor (تطبيق Android) =================
  // داخل التطبيق: الحفظ عبر @capacitor/filesystem والمشاركة عبر @capacitor/share. في المتصفح: تنزيل عادي.
  const CAP = window.Capacitor;
  const isNative = () => !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
  const plug = n => (CAP && CAP.Plugins && CAP.Plugins[n]) || null;
  const SAVE_DIR = 'Nass';
  const blobToBase64 = blob => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
  const safeName = n => String(n).replace(/[\\/:*?"<>|]+/g, '_');

  // يحفظ الملف في Documents/Nass، وإن رُفض (أذونات أو Android 10+) يحفظه في مجلد التطبيق الذي لا يحتاج إذنًا
  async function nativeSave(blob, name) {
    const FS = plug('Filesystem');
    if (!FS) throw new Error('إضافة Filesystem غير مثبّتة في التطبيق.');
    const data = await blobToBase64(blob);
    const exists = async (dir, path) => { try { await FS.stat({ path, directory: dir }); return true; } catch (e) { return false; } };
    const unique = async (dir) => {
      const base = safeName(name), dot = base.lastIndexOf('.');
      const stem = dot > 0 ? base.slice(0, dot) : base, ext = dot > 0 ? base.slice(dot) : '';
      let path = SAVE_DIR + '/' + base, n = 2;
      while (await exists(dir, path)) path = SAVE_DIR + '/' + stem + ' (' + (n++) + ')' + ext;
      return path;
    };
    const write = async dir => { const path = await unique(dir); const r = await FS.writeFile({ path, data, directory: dir, recursive: true }); return { uri: r.uri, path }; };
    try {
      if (await ensureStorage(FS, false)) { const r = await write('DOCUMENTS'); return { ...r, where: 'مجلد المستندات' }; }
    } catch (e) {}
    const r = await write('EXTERNAL');
    return { ...r, where: 'مجلد التطبيق (Android/data)' };
  }

  // نص مرسوم على صفحات A4 (الخطوط القياسية في PDF لا تدعم العربية)
  function wrapLines(ctx, text, maxW) {
    const out = [];
    for (const para of text.split('\n')) {
      let line = '';
      for (const w of para.split(' ')) {
        const t = line ? line + ' ' + w : w;
        if (line && ctx.measureText(t).width > maxW) { out.push(line); line = w; }
        else line = t;
      }
      out.push(line);
    }
    return out;
  }

  function textPages(text) {
    const W = 1240, H = 1754, M = 120, LH = 56;
    const m = makeCanvas(1, 1).getContext('2d');
    m.font = FONT;
    const pages = [];
    let c, x, y;
    const newPage = () => {
      c = makeCanvas(W, H);
      x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      x.fillStyle = '#111'; x.font = FONT; x.direction = 'rtl'; x.textAlign = 'right';
      y = M; pages.push(c);
    };
    newPage();
    for (const ln of wrapLines(m, text, W - 2 * M)) {
      if (y > H - M) newPage();
      x.fillText(ln, W - M, y);
      y += LH;
    }
    return pages;
  }

  async function addCanvasPage(doc, canvas) {
    const page = doc.addPage([595, 842]);
    const img = await doc.embedPng(await canvasBytes(canvas));
    const s = Math.min(555 / img.width, 800 / img.height);
    const w = img.width * s, h = img.height * s;
    page.drawImage(img, { x: (595 - w) / 2, y: 842 - 30 - h, width: w, height: h });
  }

  async function pdfFrom(file) {
    const doc = await PDFDocument.create();
    if (file.name.toLowerCase().endsWith('.docx')) {
      const { value } = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      for (const c of textPages(value)) await addCanvasPage(doc, c);
    } else {
      const bmp = await createImageBitmap(file);
      const c = makeCanvas(bmp.width, bmp.height);
      c.getContext('2d').drawImage(bmp, 0, 0);
      await addCanvasPage(doc, c);
    }
    return [{ blob: new Blob([await doc.save()], { type: 'application/pdf' }), name: baseName(file) + '.pdf' }];
  }

  async function textToPdf(text) {
    const doc = await PDFDocument.create();
    for (const c of textPages(text)) await addCanvasPage(doc, c);
    return [{ blob: new Blob([await doc.save()], { type: 'application/pdf' }), name: 'nass-text.pdf' }];
  }

  async function uploadPdf(file) {

  async function pdfToWord(file) {
    const pdf = await loadPdfFile(file);
    const esc = s => s.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    let body = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      body += `<p>${esc(tc.items.map(it => it.str).join(' '))}</p>`;
    }
    const html = `\ufeff<html xmlns:o="urn:schemas-microsoft-com:office:office" dir="rtl"><head><meta charset="utf-8"></head><body dir="rtl">${body}</body></html>`;
    return [{ blob: new Blob([html], { type: 'application/msword' }), name: baseName(file) + '.doc' }];
  }

  async function pdfToJpg(file) {
    const pdf = await loadPdfFile(file);
    const items = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 2 });
      const c = makeCanvas(vp.width, vp.height);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      items.push({ blob, name: `${baseName(file)}-page-${i}.jpg` });
    }
    return items;
  }

  async function editPdf(file) {
    const text = prompt('اكتب النص الذي تريد إضافته إلى الصفحة الأولى:');
    if (!text || !text.trim()) { showResult('لم تُضف أي نص.'); return []; }

    const lines = text.split('\n');
    const c = makeCanvas(900, lines.length * 60 + 30);
    const x = c.getContext('2d');
    x.font = FONT; x.fillStyle = '#111'; x.direction = 'rtl'; x.textAlign = 'right';
    lines.forEach((l, i) => x.fillText(l, 890, 50 + i * 60));

    const doc = await PDFDocument.load(await file.arrayBuffer());
    const page = doc.getPage(0);
    const img = await doc.embedPng(await canvasBytes(c));
    const w = page.getWidth() * 0.6, h = w * img.height / img.width;
    page.drawImage(img, { x: (page.getWidth() - w) / 2, y: 60, width: w, height: h });

    return [{ blob: new Blob([await doc.save()], { type: 'application/pdf' }), name: baseName(file) + '-edited.pdf' }];
  }



  // ضغط PDF: إعادة رسم الصفحات كصور JPEG بجودة أقل (النص يصبح صورًا)
  async function compressPdf(file) {
    const pdf = await loadPdfFile(file);
    const doc = await PDFDocument.create();
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: 1.5 });
      const c = makeCanvas(vp.width, vp.height);
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: x, viewport: vp }).promise;
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.6));
      const img = await doc.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      doc.addPage([base.width, base.height]).drawImage(img, { x: 0, y: 0, width: base.width, height: base.height });
    }
    const out = new Blob([await doc.save()], { type: 'application/pdf' });
    if (out.size >= file.size) { showResult('الملف مضغوط أصلًا، ولن يصغر أكثر بهذه الطريقة.'); return []; }
    const saved = Math.round((1 - out.size / file.size) * 100);
    return [{ blob: out, name: baseName(file) + '-compressed.pdf', note: `قلّ الحجم بنسبة ${saved}%` }];
  }

  // ================= أدوات القراءة =================
  async function pageTexts(file) {
    const pdf = await loadPdfFile(file);
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      pages.push(tc.items);
    }
    return pages;
  }

  // قراءة بصوت عالٍ عبر محرك النطق في المتصفح (Web Speech)
  async function readAloud(file) {
    if (!('speechSynthesis' in window)) { showResult('متصفحك لا يدعم القراءة الصوتية، جرّب Chrome.'); return []; }
    const pages = (await pageTexts(file)).map(items => items.map(t => t.str).join(' ').replace(/\s+/g, ' ').trim());
    if (!pages.some(Boolean)) { showResult('لا يوجد نص قابل للقراءة في الملف (قد يكون ممسوحًا ضوئيًا).'); return []; }

    let page = 0, rate = 1, playing = false, token = 0, voice = null;
    const info = el('p', 'text-sm text-white/70 mb-3');
    const txt = el('p', 'text-base leading-loose max-h-48 overflow-y-auto bg-white/5 rounded-xl p-3 mb-4');
    const chunks = t => (t.match(/.{1,180}(?:[.!؟?،,]\s|\s|$)/g) || []).map(x => x.trim()).filter(Boolean);
    const mk = text => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = voice ? voice.lang : 'ar-SA'; u.rate = rate;
      if (voice) u.voice = voice;
      return u;
    };
    const stop = () => { token++; speechSynthesis.cancel(); playing = false; };
    const sync = () => {
      info.textContent = `الصفحة ${page + 1} من ${pages.length}`;
      txt.textContent = pages[page] || '(صفحة بلا نص)';
      toggle.textContent = playing ? '⏹ إيقاف' : '▶ تشغيل';
    };
    function play() {
      speechSynthesis.cancel();
      const my = ++token; playing = true; sync();
      const parts = chunks(pages[page]); let k = 0;
      const next = () => {
        if (my !== token) return;
        if (k >= parts.length) {
          if (page < pages.length - 1) { page++; play(); } else { playing = false; sync(); }
          return;
        }
        const u = mk(parts[k++]);
        u.onend = next;
        u.onerror = () => { if (my === token) { playing = false; sync(); toast('تعذّر تشغيل الصوت. ارفع صوت الجهاز وتأكد من تثبيت صوت عربي.', false); } };
        speechSynthesis.speak(u);
      };
      setTimeout(next, 80); // فاصل بسيط بعد الإلغاء يمنع ضياع أول جملة في بعض المتصفحات
    }
    const go = d => { const was = playing; stop(); page = Math.min(pages.length - 1, Math.max(0, page + d)); sync(); if (was) play(); };
    const toggle = btn('flex-1 bg-[#6d4fb3] font-bold rounded-xl py-3', '', () => (playing ? (stop(), sync()) : play()));
    const speed = el('select', 'bg-white/10 rounded-xl px-3 py-3 text-white');
    [['0.8', 'بطيء'], ['1', 'عادي'], ['1.25', 'أسرع'], ['1.5', 'سريع']].forEach(([v, l]) => { const o = el('option', '', l); o.value = v; if (v === '1') o.selected = true; speed.append(o); });
    speed.onchange = () => { rate = +speed.value; if (playing) play(); };
    const row = el('div', 'flex gap-2');
    row.append(btn('bg-white/10 rounded-xl px-4 py-3', '⏮', () => go(-1)), toggle, btn('bg-white/10 rounded-xl px-4 py-3', '⏭', () => go(1)), speed);

    // اختيار الصوت العربي وتجربته
    const voiceSel = el('select', 'w-full bg-white/10 rounded-xl px-3 py-3 text-white mt-3');
    const help = el('p', 'text-xs text-amber-300 mt-3 leading-relaxed hidden',
      'لم أجد صوتًا عربيًا على جهازك. افتح إعدادات الجهاز وابحث عن «تحويل النص إلى كلام» ثم نزّل بيانات الصوت العربي (الأسماء تختلف بين الأجهزة)، وبعدها اضغط «تجربة الصوت».');
    const fillVoices = () => {
      const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('ar'));
      const keep = voiceSel.value;
      voiceSel.replaceChildren(...(vs.length
        ? vs.map(v => { const o = el('option', '', `${v.name} (${v.lang})`); o.value = v.voiceURI; return o; })
        : [el('option', '', 'الصوت الافتراضي للجهاز')]));
      if (keep && vs.some(v => v.voiceURI === keep)) voiceSel.value = keep;
      voice = vs.find(v => v.voiceURI === voiceSel.value) || vs[0] || null;
      help.classList.toggle('hidden', vs.length > 0);
    };
    voiceSel.onchange = () => { fillVoices(); if (playing) play(); };
    speechSynthesis.onvoiceschanged = fillVoices;
    const test = btn('w-full border border-white/20 rounded-xl py-3 mt-3 font-bold', '🔈 تجربة الصوت', () => {
      stop(); sync();
      setTimeout(() => {
        const u = mk('مرحبًا، هذا اختبار للصوت العربي.');
        u.onerror = () => toast('تعذّر تشغيل الصوت. ارفع صوت الجهاز وتأكد من تثبيت صوت عربي.', false);
        speechSynthesis.speak(u);
      }, 80);
    });

    openSheet('قراءة بصوت عالٍ', info, txt, row, voiceSel, test, help);
    sheetCleanup = () => { stop(); speechSynthesis.onvoiceschanged = null; };
    fillVoices(); sync();
    return [];
  }

  // وضع القراءة: النص يتدفق في فقرات تناسب عرض الشاشة وبحجم خط تختاره
  async function liquidPdf(file) {
    const paras = [];
    for (const items of await pageTexts(file)) {
      let cur = '', lastY = null;
      for (const it of items) {
        if (!it.str.trim()) continue;
        const y = it.transform[5], h = it.height || 12;
        if (lastY !== null && cur && Math.abs(lastY - y) > h * 1.8) { paras.push(cur); cur = ''; }
        cur += (cur ? ' ' : '') + it.str.trim(); lastY = y;
      }
      if (cur) paras.push(cur);
    }
    if (!paras.length) { showResult('لا يوجد نص في الملف (قد يكون ممسوحًا ضوئيًا).'); return []; }
    let fs = 18;
    const body = el('div', 'grid gap-4 max-h-[60vh] overflow-y-auto leading-loose text-white/90');
    paras.forEach(p => body.append(el('p', '', p)));
    const size = d => { fs = Math.min(34, Math.max(12, fs + d)); body.style.fontSize = fs + 'px'; };
    size(0);
    const bar = el('div', 'flex gap-2 mb-4');
    bar.append(btn('bg-white/10 rounded-xl px-5 py-2 font-bold', 'أ−', () => size(-2)), btn('bg-white/10 rounded-xl px-5 py-2 font-bold text-xl', 'أ+', () => size(2)));
    openSheet('وضع القراءة', bar, body);
    return [];
  }

  // ---- اقتصاص الصفحات: هوامش بالنسبة المئوية من كل جانب، مع معاينة ----
  function cropSheet() {
    openSheet('اقتصاص الصفحات',
      el('p', 'text-sm text-white/70 mb-3 leading-relaxed', 'اختر ملف PDF ثم حدّد نسبة الهامش المراد قصّه من كل جانب.'),

  async function cropOptions(file) {
    let doc;
    try { doc = await openPdfLib(file); } catch (e) { toast(e.message, false); return; }
    if (!doc.getPageCount()) { toast('الملف لا يحتوي على صفحات.', false); return; }
    const first = doc.getPage(0), fb = first.getCropBox(), swap = first.getRotation().angle % 180 !== 0;
    const vw = swap ? fb.height : fb.width, vh = swap ? fb.width : fb.height;
    const frame = el('div', 'relative mx-auto bg-white/90 rounded');
    frame.style.width = Math.min(200, 240 * vw / vh) + 'px'; frame.style.aspectRatio = vw + ' / ' + vh;
    const box = el('div', 'absolute border-2 border-dashed border-purple-600 bg-purple-500/20');
    frame.append(box);
    const inputs = {}, grid = el('div', 'grid grid-cols-2 gap-3 my-4');
    [['t', 'أعلى %'], ['b', 'أسفل %'], ['r', 'يمين %'], ['l', 'يسار %']].forEach(([k, label]) => {
      const i = el('input', INPUT); i.type = 'number'; i.min = 0; i.max = 45; i.value = 10; i.inputMode = 'decimal'; i.dir = 'ltr';
      i.oninput = upd; inputs[k] = i;
      const w = el('label', 'grid gap-1 text-sm text-white/80', label); w.append(i); grid.append(w);
    });
    const val = k => Math.max(0, Math.min(45, parseFloat(inputs[k].value) || 0));
    function upd() { box.style.top = val('t') + '%'; box.style.bottom = val('b') + '%'; box.style.right = val('r') + '%'; box.style.left = val('l') + '%'; }
    upd();
    const go = btn('w-full bg-[#6d4fb3] font-bold rounded-xl py-3', 'تطبيق الاقتصاص على كل الصفحات', async () => {
      const T = val('t') / 100, B = val('b') / 100, L = val('l') / 100, R = val('r') / 100;
      if (T + B >= 0.9 || L + R >= 0.9) { toast('الهوامش كبيرة جدًا.', false); return; }
      if (!(T || B || L || R)) { toast('أدخل هامشًا واحدًا على الأقل.', false); return; }
      closeSheet(); busy = true; toast('جارٍ الاقتصاص...');
      try {
        for (const p of doc.getPages()) {
          const rot = ((p.getRotation().angle % 360) + 360) % 360, bx = p.getCropBox();
          // الهوامش مأخوذة كما تظهر على الشاشة، وتُحوَّل إلى إحداثيات الصفحة الأصلية حسب دورانها
          let l, r, t, b;
          if (rot === 90) { l = T; t = R; r = B; b = L; }
          else if (rot === 180) { l = R; r = L; t = B; b = T; }
          else if (rot === 270) { l = B; t = L; r = T; b = R; }
          else { l = L; r = R; t = T; b = B; }
          const x = bx.x + bx.width * l, y = bx.y + bx.height * b, w = bx.width * (1 - l - r), h = bx.height * (1 - t - b);
          p.setMediaBox(x, y, w, h); p.setCropBox(x, y, w, h);
        }
        const blob = new Blob([await doc.save()], { type: 'application/pdf' });
        await deliver('crop', file.name, [{ blob, name: baseName(file) + '-cropped.pdf', note: 'تم اقتصاص الصفحات' }]);
      } catch (err) { toast('تعذّرت العملية: ' + (err.message || err), false); }
      finally { busy = false; }
    });
    openSheet('اقتصاص: ' + file.name, el('p', 'text-xs text-white/60 mb-3 text-center', 'المنطقة المظللة هي ما سيبقى من الصفحة'), frame, grid, go);
  }

    let doc;
    try { doc = await openPdfLib(file); } catch (e) { toast(e.message, false); return; }
    const n = doc.getPageCount();
    if (!n) { toast('الملف لا يحتوي على صفحات.', false); return; }
    let pages = Array.from({ length: n }, (_, i) => ({ src: i, rot: 0 }));
    const thumbs = {}, thumbEls = {};
    let cancelled = false;
    const fillThumb = (th, p) => {
      th.replaceChildren();
      if (thumbs[p.src]) { const im = new Image(); im.src = thumbs[p.src]; im.className = 'max-w-full max-h-full'; im.style.transform = 'rotate(' + p.rot + 'deg)'; th.append(im); }
      else th.textContent = p.src + 1;
    };
    const list = el('div', 'grid gap-2 max-h-[50vh] overflow-y-auto mb-3');
    const move = (i, d) => { const j = i + d; if (j < 0 || j >= pages.length) return; [pages[i], pages[j]] = [pages[j], pages[i]]; draw(); };
    function draw() {
      list.replaceChildren(...pages.map((p, i) => {
        const row = el('div', 'flex items-center gap-2 bg-white/5 rounded-xl p-2');
        const th = el('div', 'w-12 h-16 shrink-0 grid place-items-center bg-white/10 rounded text-xs overflow-hidden');
        thumbEls[p.src] = th; fillThumb(th, p);
        const info = el('div', 'flex-1 min-w-0'); info.append(el('div', 'font-bold', 'صفحة ' + (p.src + 1)), el('div', 'text-xs text-white/60', 'الموضع الجديد: ' + (i + 1) + (p.rot ? ' — مدوّرة ' + p.rot + '°' : '')));
        row.append(th, info, smallBtn('↑', () => move(i, -1)), smallBtn('↓', () => move(i, 1)),
          smallBtn('⟳', () => { p.rot = (p.rot + 90) % 360; draw(); }),
          smallBtn('🗑', () => { if (pages.length === 1) { toast('لا يمكن حذف كل الصفحات.', false); return; } pages.splice(i, 1); draw(); }));
        return row;
      }));
      count.textContent = 'عدد الصفحات في الناتج: ' + pages.length;
    }
    const count = el('p', 'text-xs text-white/60 mb-2 text-center');
    const go = btn('w-full bg-[#6d4fb3] font-bold rounded-xl py-3', 'حفظ الملف الجديد', async () => {
      closeSheet(); busy = true; toast('جارٍ الحفظ...');
      try {
        const out = await PDFDocument.create();
        const copied = await out.copyPages(doc, pages.map(p => p.src));
        copied.forEach((pg, i) => {
          const base = ((doc.getPage(pages[i].src).getRotation().angle % 360) + 360) % 360;
          pg.setRotation(PDFLib.degrees((base + pages[i].rot) % 360));
          out.addPage(pg);
        });
        const blob = new Blob([await out.save()], { type: 'application/pdf' });
        await deliver('organize', file.name, [{ blob, name: baseName(file) + '-organized.pdf', note: 'تم حفظ ترتيب الصفحات الجديد' }]);
      } catch (err) { toast('تعذّرت العملية: ' + (err.message || err), false); }
      finally { busy = false; }
    });
    openSheet('تنظيم: ' + file.name, count, list, go);
    sheetCleanup = () => { cancelled = true; };
    draw();
    // صور مصغّرة اختيارية: إن تعذّرت تبقى أرقام الصفحات
    (async () => {
      try {
        const pdf = await loadPdfFile(file);
        for (let i = 1; i <= Math.min(n, 60); i++) {
          if (cancelled) return;
          const pg = await pdf.getPage(i), vp = pg.getViewport({ scale: 0.3 });
          const c = makeCanvas(vp.width, vp.height), x = c.getContext('2d');
          x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
          await pg.render({ canvasContext: x, viewport: vp }).promise;
          thumbs[i - 1] = c.toDataURL('image/jpeg', 0.6);
          const cur = pages.find(p => p.src === i - 1);
          if (cur && thumbEls[i - 1]) fillThumb(thumbEls[i - 1], cur);
        }
      } catch (e) {}
    })();
  }

  // ---- دمج الملفات: إضافة وترتيب ثم دمج ----
  async function mergePdfs(files) {
    const out = await PDFDocument.create();
    for (const f of files) {
      const src = await openPdfLib(f);
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(p => out.addPage(p));
    }
    const blob = new Blob([await out.save()], { type: 'application/pdf' });
    return [{ blob, name: 'merged-' + Date.now() + '.pdf', note: 'تم دمج ' + files.length + ' ملفات' }];
  }

    });

      fileButton('إضافة ملفات PDF', true, fs => { files = files.concat(fs); draw(); }, 'bg-white/10'), pickHint(), list, go);

  const MIC_ERR = { 'not-allowed': 'اسمح للمتصفح باستخدام الميكروفون.', 'service-not-allowed': 'اسمح للمتصفح باستخدام الميكروفون.',
    'network': 'الإملاء الصوتي يحتاج اتصالًا بالإنترنت.', 'audio-capture': 'لم أجد ميكروفونًا في جهازك.' };

  // ---- إملاء أصلي داخل تطبيق Android عبر @capacitor-community/speech-recognition ----
  const DICTATION_LANG = 'ar-SA';
  async function ensureNativeMic(SR) {
    let state;
    try { state = ((await SR.checkPermissions()) || {}).speechRecognition; } catch (e) { state = 'prompt'; }
    if (state === 'granted') return true;
    if (state === 'denied') { await permDenied('🎤', 'الميكروفون غير مسموح', NO_MIC); return false; }
    const yes = await askPermission('🎤', 'السماح باستخدام الميكروفون؟',
      'نستعمله فقط عندما تضغط «إملاء صوتي» لتحويل كلامك إلى نص. تتولى خدمة الكلام في جهازك معالجة الصوت، ولا يحفظ التطبيق أي تسجيل.');
    if (!yes) return false;
    try { const r = await SR.requestPermissions(); if (r && r.speechRecognition === 'granted') return true; } catch (e) {}
    await permDenied('🎤', 'الميكروفون غير مسموح', NO_MIC);
    return false;
  }
  // جلسات متتالية حتى يضغط المستخدم إيقاف أو تمر جلسة صامتة. النص الجزئي يظهر مباشرة في المربع
  function nativeDictation(SR, ta, onEnd) {
    const join = (a, b) => a + (a && !/\s$/.test(a) ? ' ' : '') + b;
    const wait = ms => new Promise(r => setTimeout(r, ms));
    let active = true, handle = null, base = '', gotText = false;
    const cleanup = async () => {
      active = false;
      try { await SR.stop(); } catch (e) {}
      const h = handle; handle = null;
      if (h && h.remove) { try { await h.remove(); } catch (e) {} }
    };
    const end = async msg => { if (!active) return; await cleanup(); onEnd(); if (msg) toast(msg, false); };
    const SILENT = 'لم أسمع شيئًا. اضغط «إملاء صوتي» وحاول مجددًا.';
    const session = async () => {
      if (!active) return;
      gotText = false; base = ta.value;
      try {
        const res = await SR.start({ language: DICTATION_LANG, maxResults: 1, partialResults: true, popup: false });
        const m = res && res.matches && res.matches[0];
        if (m && !gotText && active) { gotText = true; ta.value = join(base, String(m).trim()); }
      } catch (e) {
        if (!active) return;
        const msg = String((e && e.message) || e);
        if (/no.?match|no.?speech|timeout/i.test(msg)) { if (gotText) session(); else end(SILENT); return; }
        end('تعذّر الإملاء الصوتي: ' + msg); return;
      }
      await wait(500);
      while (active) {
        let listening = false;
        try { const s = await SR.isListening(); listening = !!(s && s.listening); } catch (e) {}
        if (!listening) break;
        await wait(300);
      }
      if (!active) return;
      if (!gotText) { end(SILENT); return; }
      session(); // جلسة جديدة للإملاء المتواصل
    };
    (async () => {
      try {
        const h = await SR.addListener('partialResults', ev => {
          const m = ev && ev.matches && ev.matches[0];
          if (!active || !m) return;
          gotText = true; ta.value = join(base, String(m).trim());
        });
        if (active) handle = h; else if (h && h.remove) h.remove();
      } catch (e) {}
      session();
    })();
    return { stop: cleanup };
  }

  // إملاء صوتي: داخل تطبيق Android يستعمل الإضافة الأصلية، وفي المتصفح Web Speech API (Chrome يرسل الصوت إلى خوادم Google)
  function micButton(ta) {
    const WebSR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const LABEL = '🎤 إملاء صوتي';
    const b = el('button', 'mt-3 w-full border border-white/20 rounded-xl py-3 font-bold', LABEL);
    let ctl = null, asking = false;
    const stop = () => { const c = ctl; ctl = null; b.textContent = LABEL; if (c) c.stop(); };
    b.stop = stop;
    b.onclick = async () => {
      if (ctl) { stop(); return; }
      if (asking) return;
      if (isNative()) {
        const SR = plug('SpeechRecognition');
        if (!SR) { toast('الإملاء الصوتي غير متاح في هذه النسخة من التطبيق.', false); return; }
        asking = true;
        try {
          let avail = true;
          try { avail = !!((await SR.available()) || {}).available; } catch (e) {}
          if (!avail) { toast('خدمة التعرف على الكلام غير متوفرة في جهازك. فعّل «خدمات الكلام من Google» ثم جرّب.', false); return; }
          if (!(await ensureNativeMic(SR))) return;
        } finally { asking = false; }
        b.textContent = '⏹ إيقاف الإملاء';
        ctl = nativeDictation(SR, ta, () => { ctl = null; b.textContent = LABEL; });
        return;
      }
      if (!WebSR) { toast('الإملاء الصوتي غير مدعوم في هذا المتصفح، جرّب Chrome.', false); return; }
      asking = true; const allowed = await ensureMic(); asking = false;
      if (!allowed) return;
      const rec = new WebSR(); rec.lang = 'ar-SA'; rec.continuous = true; rec.interimResults = false;
      rec.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal)
          ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + e.results[i][0].transcript.trim();
      };
      rec.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') toast(MIC_ERR[e.error] || 'تعذّر الإملاء الصوتي.', false); stop(); };
      rec.onend = () => stop();
      ctl = { stop: () => { rec.onend = null; try { rec.stop(); } catch (e) {} } };
      b.textContent = '⏹ إيقاف الإملاء';
      try { rec.start(); } catch (e) { stop(); }
    };
    return b;
  }

  // الأوضاع: home (داخل) | switch | add | login (خارج) | password | delete | recovery | forgot | reset | norecovery
  function accountSheet(note = '', opt = {}) {
    const user = currentUser(), users = getUsers(), accounts = Object.keys(users);

    const initial = a => ((users[a] && users[a].name) || a)[0].toUpperCase();

      b.append(el('span', 'w-9 h-9 rounded-full bg-[#4c2fa8] grid place-items-center font-bold shrink-0', initial(acc)),
        el('span', 'flex-1 truncate', label(acc)), el('span', 'text-xs ' + (acc === user ? 'text-emerald-300' : 'text-white/50'), acc === user ? 'الحالي' : 'تبديل'));
      if (onclick) b.onclick = onclick;
      return b;
    };
    const field = (type, ph, ac) => { const i = el('input', INPUT); i.type = type; i.placeholder = ph; i.autocomplete = ac; return i; };
    const qSelect = () => {
      const s = el('select', INPUT); s.style.colorScheme = 'dark';
      [['', 'سؤال الأمان (اختياري)'], ...QUESTIONS.map(q => [q, q])].forEach(([v, tx]) => { const o = document.createElement('option'); o.value = v; o.textContent = tx; s.append(o); });
      return s;
    };
    const eyeFor = (...inputs) => {
      const b = btn('text-xs text-white/60 underline justify-self-start', 'إظهار كلمة المرور', () => {
        const show = inputs[0].type === 'password';
        inputs.forEach(i => { i.type = show ? 'text' : 'password'; });
        b.textContent = show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور';
      });
      return b;
    };
    let working = false;
    // fn قد تعيد رمز استرجاع جديدًا (نص) فيُعرض مرة واحدة قبل المتابعة
    const run = async (fn, ok) => {
      if (working) return;
      working = true;
      try {
        const res = await fn(); render();
        const done = () => { accountSheet(ok); toast(ok); };
        if (typeof res === 'string' && res) recoverySheet(res, done); else done();
      } catch (err) { say(err instanceof DOMException ? 'تعذّر الحفظ على الجهاز: التخزين المحلي معطّل في هذا المتصفح.' : (err.message || 'حدث خطأ غير متوقع.'), false); }
      finally { working = false; }
    };
    const enterTo = (input, action) => { input.onkeydown = e => { if (e.key === 'Enter') action(); }; };
    const cancel = () => btn('flex-1 border border-white/20 rounded-xl py-3 font-bold', 'رجوع', back);
    const primary = (tx, fn) => btn('flex-1 bg-[#6d4fb3] font-bold rounded-xl py-3', tx, fn);
    const norm = v => v.trim().toLowerCase();
    const row = el('div', 'flex gap-3');

    if (mode === 'home') {
      const me = users[user], recOn = !!(me && me.rec);
      wrap.append(hint('الحسابات على هذا الجهاز'), accRow(user, null),
        ...accounts.filter(x => x !== user).map(x => accRow(x, () => accountSheet('', { mode: 'switch', email: x }))),
        btn('border border-purple-400/60 text-purple-200 rounded-xl py-3 font-bold', '➕ إضافة حساب جديد', () => accountSheet('', { mode: 'add' })),

  function permDialog(icon, title, text, buttons) {
    return new Promise(resolve => {
      const ov = el('div', 'nw-overlay'); ov.setAttribute('data-perm', '1');
      const card = el('div', 'nw-card'); card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'true');
      const done = v => { ov.remove(); resolve(v); };

      buttons.forEach(([cls, label, val]) => card.append(btn(cls, label, () => done(val))));
      ov.onclick = e => { if (e.target === ov) done(false); };
      ov.append(card); document.body.append(ov);
      card.firstChild.style.fontSize = '2.2rem'; card.firstChild.style.marginBottom = '6px';
    });

  async function ensureMic() {
    let state = 'unknown';
    try { if (navigator.permissions) state = (await navigator.permissions.query({ name: 'microphone' })).state; } catch (e) {}
    if (state === 'granted') return true;
    if (state === 'denied') { await permDenied('🎤', 'الميكروفون غير مسموح', NO_MIC); return false; }
    const yes = await askPermission('🎤', 'السماح باستخدام الميكروفون؟',
      'نستعمله فقط عندما تضغط «إملاء صوتي» لتحويل كلامك إلى نص. يعالج المتصفح الصوت عبر خدمة التعرف على الكلام الخاصة به، ولا يحفظ التطبيق أي تسجيل.');
    if (!yes) return false;
    const md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) return true; // يطلبه المتصفح بنفسه عند بدء الإملاء
    try { const s = await md.getUserMedia({ audio: true }); s.getTracks().forEach(tr => tr.stop()); return true; }
    catch (e) {
      if (e && e.name === 'NotFoundError') { toast('لم أجد ميكروفونًا في جهازك.', false); return false; }
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) { await permDenied('🎤', 'الميكروفون غير مسموح', NO_MIC); return false; }
      return true;
    }
  }

  let storageDeclined = false; // لا نكرر السؤال في الجلسة نفسها بعد الرفض
  async function ensureStorage(FS, forRead) {
    let state;
    try { const pm = await FS.checkPermissions(); state = (pm && pm.publicStorage) || 'granted'; } catch (e) { return true; }
    if (state === 'granted') return true;
    if (state === 'denied' || storageDeclined) return false;
    const yes = await askPermission('💾', 'السماح بالوصول إلى المستندات؟',
      (forRead ? 'لنعرض لك ملفات PDF التي حفظتها في مجلد المستندات.' : 'لنحفظ ملفاتك الناتجة في مجلد المستندات (Documents/' + SAVE_DIR + ') فتجدها في تطبيق الملفات.') +
      ' إن رفضت، نحفظها في مجلد خاص بالتطبيق ولا يتعطل شيء.');
    if (!yes) { storageDeclined = true; return false; }
    try { const r = await FS.requestPermissions(); if (r && r.publicStorage === 'granted') return true; } catch (e) {}
    storageDeclined = true;
    return false;
  }

  // المتصفح: طلب التخزين الدائم مرة واحدة عند أول ملف يُحفظ في القائمة
  async function ensurePersist() {
    try {
      if (localStorage.getItem('nass_persist') === '1' || !(navigator.storage && navigator.storage.persist)) return;
      localStorage.setItem('nass_persist', '1');
      if (navigator.storage.persisted && await navigator.storage.persisted()) return;
      await navigator.storage.persist();
    } catch (e) {}
  }

  window.addEventListener('unhandledrejection', e => toast('حدث خطأ: ' + ((e.reason && e.reason.message) || e.reason), false));
  window.addEventListener('error', e => toast('حدث خطأ: ' + e.message, false));
  render();
</script>
</body>
