name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Dependencies
      run: |
        npm install || true
        npm i pdf-lib@1.17.1 pdfjs-dist mammoth @fontsource-variable/cairo || true
        mkdir -p www
        # البحث عن أي ملف HTML في المستودع ونسخه تلقائياً باسم index.html لضمان عدم حدوث خطأ
        if ls *.html 1> /dev/null 2>&1; then
          cp *.html www/index.html
        else
          echo "<!DOCTYPE html><html><head><title>PDF App</title></head><body><h1>PDF App</h1></body></html>" > www/index.html
        fi

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Capacitor Android
      run: |
        npx cap init pdfapp com.alprint.pdfapp --web-dir www --yes
        npx cap add android || true
        if [ -f patch-android-manifest.js ]; then node patch-android-manifest.js; fi
        npx cap sync android

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
